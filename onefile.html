<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyScript Pygame Selector</title>

  <link
    rel="stylesheet"
    href="https://pyscript.net/releases/2026.3.1/core.css"
  >

  <script
    type="module"
    src="https://pyscript.net/releases/2026.3.1/core.js"
  ></script>

  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #181818;
      color: white;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select,
    button,
    input {
      padding: 8px 12px;
      font: inherit;
    }

    #customUrl {
      width: min(450px, 80vw);
    }

    [hidden] {
      display: none !important;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hint {
      color: #bbb;
      font-size: 14px;
    }

    #canvas {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 15px;
      border: 1px solid #555;
      background: black;
      image-rendering: pixelated;
      outline: none;
    }

    #canvas:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none;
      margin: 0;
      border: none !important;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>
  <div class="controls">
    <label for="gameSelect">Choose a game:</label>

    <select id="gameSelect">
      <option value="https://raw.githubusercontent.com/George-LJH/PygameIntroductionWithPyScript/refs/heads/main/main.py">
        Blnk
      </option>

      <option value="https://raw.githubusercontent.com/George-LJH/TerraWeek2/refs/heads/main/main.py">
        Pong
      </option>

      <option value="custom">
        Custom Python link
      </option>
    </select>

    <input
      id="customUrl"
      type="url"
      placeholder="https://example.com/main.py"
      aria-label="Custom Python script URL"
      hidden
    >

    <button id="runBtn" disabled>Run Game</button>
  </div>

  <p class="hint">
    Custom links must point directly to a browser-compatible Python script.
    Only run code you trust.
  </p>

  <p id="status" role="status">
    Loading Python and pygame-ce...
  </p>

  <!-- Each Python game determines its own rendering resolution. -->
  <canvas id="canvas" tabindex="0"></canvas>

  <script>
    const runButton = document.getElementById("runBtn");
    const gameCanvas = document.getElementById("canvas");
    const gameSelector = document.getElementById("gameSelect");
    const customUrlInput = document.getElementById("customUrl");
    const statusElement = document.getElementById("status");

    gameSelector.addEventListener("change", () => {
      const isCustom = gameSelector.value === "custom";
      customUrlInput.hidden = !isCustom;

      if (isCustom) {
        customUrlInput.focus();
      }
    });

    runButton.addEventListener("click", (event) => {
      // Validate before entering fullscreen or starting Python.
      if (gameSelector.value === "custom") {
        try {
          const url = new URL(customUrlInput.value.trim());

          if (url.protocol !== "https:") {
            throw new Error("Use an HTTPS link.");
          }
        } catch (error) {
          statusElement.textContent =
            "Enter a valid HTTPS link to a raw Python file.";

          customUrlInput.focus();
          event.stopImmediatePropagation();
          return;
        }
      }

      // Fullscreen must be requested directly during the user click.
      if (!document.fullscreenElement && gameCanvas.requestFullscreen) {
        gameCanvas.requestFullscreen()
          .then(() => gameCanvas.focus())
          .catch((error) => {
            // The game can still run if fullscreen is blocked.
            console.warn("Fullscreen unavailable:", error);
            gameCanvas.focus();
          });
      } else {
        gameCanvas.focus();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement === gameCanvas) {
        gameCanvas.focus();
      }
    });

    gameCanvas.addEventListener("click", () => {
      gameCanvas.focus();
    });
  </script>

  <script type="py-game" target="canvas">
import ast
import asyncio
import inspect
import traceback
import js
import pygame
from pyscript import ffi

button = js.document.getElementById("runBtn")
selector = js.document.getElementById("gameSelect")
custom_input = js.document.getElementById("customUrl")
status = js.document.getElementById("status")
canvas = js.document.getElementById("canvas")

game_task = None

async def load_and_run_game():
    button.disabled = True
    selector.disabled = True
    custom_input.disabled = True

    status.textContent = "Downloading game..."

    try:
        script_url = str(selector.value)

        if script_url == "custom":
            script_url = str(custom_input.value).strip()

            if not script_url.startswith("https://"):
                raise ValueError(
                    "Enter a valid HTTPS link to a raw Python file."
                )

        response = await js.fetch(script_url)

        if not response.ok:
            raise RuntimeError(
                f"Download failed: HTTP {response.status}"
            )

        code_content = str(await response.text())

        # Allow fetched scripts to contain top-level await.
        compiled = compile(
            code_content,
            script_url,
            "exec",
            flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
        )

        # Separate game variables from the loader's globals.
        # This is not a security sandbox.
        namespace = {
            "__name__": "__main__",
            "__file__": script_url,
        }

        status.textContent = (
            "Game running. Press Esc to leave fullscreen. "
            "Reload the page to choose another game."
        )

        canvas.focus()

        # The game chooses its resolution through pygame.Window(...)
        # or pygame.display.set_mode(...).
        result = eval(compiled, namespace)

        if inspect.isawaitable(result):
            await result

        status.textContent = "Game finished."

    except Exception:
        error = traceback.format_exc()
        status.textContent = error
        print(error)

    finally:
        # Reveal status information after the game exits or fails.
        if js.document.fullscreenElement == canvas:
            try:
                await js.document.exitFullscreen()
            except Exception:
                pass

        button.disabled = False
        selector.disabled = False
        custom_input.disabled = False

def on_run_click(event):
    global game_task

    if game_task is not None and not game_task.done():
        return

    button.disabled = True
    selector.disabled = True
    custom_input.disabled = True

    game_task = asyncio.create_task(load_and_run_game())

# Keep the proxy alive while the page is open.
click_proxy = ffi.create_proxy(on_run_click)
button.addEventListener("click", click_proxy)

button.disabled = False
status.textContent = f"Ready — pygame-ce {pygame.version.ver}"
  </script>
</body>
</html>
